repos:
  - repo: local
    hooks:
      - id: skillgen-check
        name: skillgen --check (generated skill artifacts are up to date)
        entry: python -m tools.skillgen --check
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["--config", "pyproject.toml"]
